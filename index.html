                    <text x="32" y="37" textAnchor="middle" fontSize="15" fontWeight="800" fill="#0B3446">70%</text>
                  </svg>
                </div>
                <div className="guia-txt">
                  <h3>Meta do dia</h3>
                  <p>Cada pessoa tem uma meta de água. A barra do seu card mostra o quanto você já bebeu.</p>
                </div>
              </div>

              <div className="guia-passo">
                <div className="guia-ilustra" aria-hidden="true">
                  <svg viewBox="0 0 64 64">
                    <rect x="9" y="34" width="12" height="22" rx="2" fill="#9FD9E8" />
                    <rect x="26" y="22" width="12" height="34" rx="2" fill="#41C9E6" />
                    <rect x="43" y="41" width="12" height="15" rx="2" fill="#CDE7F0" />
                    <path d="M27 19 l2.3 -5 2.7 3 2.7 -3 2.3 5 z" fill="#F4B740" />
                  </svg>
                </div>
                <div className="guia-txt">
                  <h3>Ranking por desempenho</h3>
                  <p>O ranking da semana vale por desempenho, não só por litros: beber soma pontos, sofrer poderes desconta.</p>
                </div>
              </div>

              <div className="guia-passo guia-passo-topo">
                <div className="guia-ilustra" aria-hidden="true">
                  <svg viewBox="0 0 64 64">
                    <rect x="11" y="13" width="42" height="38" rx="7" fill="#EAF6FA" stroke="#0B3446" strokeWidth="2" />
                    <ellipse cx="33" cy="27" rx="15" ry="7.5" fill="#7E929C" />
                    <ellipse cx="23" cy="29" rx="7" ry="5" fill="#9BA9B2" />
                    <path d="M31 32 l-5 9 h5 l-2.5 8 9 -11 h-5 l3.5 -6 z" fill="#F4D03F" stroke="#C99A0E" strokeWidth="1" strokeLinejoin="round" />
                  </svg>
                </div>
                <div className="guia-txt">
                  <h3>Poderes entre colegas</h3>
                  <p>Ao bater metas você ganha poderes para aplicar em quem bebe pouco — e também pode sofrê-los. Cada um desconta do seu desempenho:</p>
                  <ul className="guia-penal">
                    <li>🌵 Cacto <b>−4%</b></li>
                    <li>🏜️ Deserto <b>−8%</b></li>
                    <li>⏳ Soterramento <b>−10%</b></li>
                    <li>⛈️ Tempestade <b>−12%</b></li>
                  </ul>
                  <p className="guia-nota">Meta abaixo de 2 L? A penalidade é 1,5× maior. Beba para escapar — tudo fica no seu histórico.</p>
                </div>
              </div>

              <div className="guia-passo">
                <div className="guia-ilustra" aria-hidden="true">
                  <svg viewBox="0 0 64 64">
                    <path d="M24 9 h6 l-2 15 h-2 z" fill="#41C9E6" />
                    <path d="M40 9 h-6 l2 15 h2 z" fill="#0F8BB0" />
                    <circle cx="32" cy="39" r="15" fill="#F4B740" stroke="#C98A16" strokeWidth="2" />
                    <path d="M32 30 l2.5 5.1 5.6 .8 -4.1 4 1 5.6 -5 -2.6 -5 2.6 1 -5.6 -4.1 -4 5.6 -.8 z" fill="#FFF7E6" />
                  </svg>
                </div>
                <div className="guia-txt">
                  <h3>Conquistas e garrafas</h3>
                  <p>Dias seguidos batendo a meta liberam conquistas, novas garrafas para colecionar e poderes mais fortes. Tudo fica no seu histórico.</p>
                </div>
              </div>

            </div>
            <button className="beber fechar-modal" onClick={() => setNovidadeDesempenho(false)}>
              Entendi!
            </button>
          </div>
        </div>
      )}

      {dica && (
        <div className="dica-agua" key={dica}>
          <span className="dica-icone" aria-hidden="true">💡</span>
          <span>{dica}</span>
        </div>
      )}

                          {e.tipo === "e" && `💧 Medida avulsa · ${fmt(e.ml || 0)}`}
                          {e.tipo === "cacto" && `🌵 Cactificado por ${e.por || "alguém"}`}
                          {e.tipo === "deserto" && `🏜️ Desertificado por ${e.por || "alguém"}`}
                          {e.tipo === "tempestade" && `⏳ Soterrado por ${e.por || "alguém"}`}
                        </span>
                        {typeof e.pct === "number" && e.pct !== 0 && (
                          <span className={`hist-pct ${e.pct > 0 ? "mais" : "menos"}`}>
                            {e.pct > 0 ? `+${e.pct}%` : `${e.pct}%`}
                          </span>
                        )}
                      </div>
                    ))}
                  </div>
                ))}
              </div>
              <button
                className="desfazer fechar-modal"
                onClick={() => setHistoricoDe(null)}
              >
                Fechar
              </button>
            </div>
          </div>
        );
      })()}

      {animCacto && (
        <AnimacaoBastao
          fromId={animCacto.fromId}
          toId={animCacto.toId}
          mode={animCacto.mode}
          onDone={() => {
            if (animCacto.mode === "cacto") {
              try { localStorage.setItem("agua-cact-anim-seen", String(animCacto.t)); } catch {}
            }
            setAnimCacto(null);
          }}
        />
      )}

      {escolhaGarrafa && (() => {
        const m = dados.members.find((x) => x.id === escolhaGarrafa.membroId);
        if (!m) return null;
        const conj = conquistas[m.id] ? conquistas[m.id].conjunto : new Set();
        const conquistasIds = CONQUISTAS_GARRAFA.filter((cid) => conj.has(cid));
        return (
          <ModalEscolhaGarrafa
            membro={m}
            creditos={creditosGarrafaDe(m.id)}
            conquistasIds={conquistasIds}
            donas={garrafasDe(m.id)}
            ativa={garrafaSelDe(m.id)}
            onAdquirir={(ids) => adquirirGarrafas(m.id, ids)}
            onSelecionarAtiva={(id) => selecionarGarrafa(m.id, id)}
            onFechar={() => setEscolhaGarrafa(null)}
          />
        );
      })()}

      {statRanking && (
        <div className="modal-fundo" onClick={() => setStatRanking(null)}>
          <div className="modal-sino stat-modal" onClick={(e) => e.stopPropagation()}>
            <h2 className="nome stat-modal-titulo">
              <span className="stat-modal-ico"><StatIcone nome={statRanking.ico} /></span>
              {statRanking.rot.join(" ")}
            </h2>
            <p className="sub">Ranking do time — do maior para o menor</p>
            <ol className="stat-rank">
              {dados.members
                .map((m) => ({ m, v: estatisticasDe(m)[statRanking.k] || 0 }))
                .sort((a, b) => b.v - a.v || a.m.name.localeCompare(b.m.name))
                .map((row, i) => {
                  const meu = meusMembros.some((x) => x.id === row.m.id);
                  const ehMl = statRanking.k === "totalMl" || statRanking.k === "mediaDia";
                  return (
                    <li key={row.m.id} className={`stat-rank-item ${meu ? "eu" : ""}`}>
                      <span className="stat-rank-pos">{i + 1}º</span>
                      <span className="stat-rank-nome">{row.m.name}{meu && <span className="stat-rank-voce"> · você</span>}</span>
                      <span className="stat-rank-val">{ehMl ? fmt(row.v) : row.v}</span>
                    </li>
                  );
                })}
            </ol>
            <button className="desfazer fechar-modal" onClick={() => setStatRanking(null)}>
              Fechar
            </button>
          </div>
        </div>
      )}

      {conquistasDe && (
        <div className="modal-fundo" onClick={() => setConquistasDe(null)}>
          <div className="modal-sino" onClick={(e) => e.stopPropagation()}>
            <h2 className="nome">Conquistas de {conquistasDe.name}</h2>
            <p className="sub">
              {fmt((conquistas[conquistasDe.id] || {}).totalMl || 0)} acumulados
              · {(conquistas[conquistasDe.id] || {}).diasMeta || 0} dia
              {((conquistas[conquistasDe.id] || {}).diasMeta || 0) !== 1 ? "s" : ""}{" "}
              de meta batida
            </p>
            <div className="lista-conquistas">
              {CONQUISTAS.map((c) => {
                const ok =
                  conquistas[conquistasDe.id] &&
                  conquistas[conquistasDe.id].conjunto.has(c.id);
                return (
                  <div key={c.id} className={`conquista ${ok ? "ok" : "bloqueada"}`}>
                    <span className={`circulo-conquista modal-circulo ${ok ? "" : "trancada"}`}>
                      {ok ? (
                        <IconeConquista conquista={c} tamanho={13} />
                      ) : (
                        <IconeCadeado />
                      )}
                    </span>
                    <span className="conquista-texto">
                      <strong>{c.nome}</strong>
                      <span>
                        {c.desc}
                        {c.id === "incactificavel" &&
                          !ok &&
                          ` (${(conquistas[conquistasDe.id] || {}).cactos || 0}x cacto)`}
                        {c.id === "rei-da-cactificacao" &&
                          ` (${(conquistas[conquistasDe.id] || {}).cactosFeitos || 0} cactificaç${((conquistas[conquistasDe.id] || {}).cactosFeitos || 0) === 1 ? "ão" : "ões"})`}
                      </span>
                      {textoRecompensa(c) && (
                        <span className="recompensa">🎁 {textoRecompensa(c)}</span>
                      )}
                    </span>
                  </div>
                );
              })}
            </div>
            <button
              className="desfazer fechar-modal"
              onClick={() => setConquistasDe(null)}
            >
              Fechar
            </button>
          </div>
        </div>
      )}

      {souAdmin && (
        <div className="admin-barra">
          <button
            className="btn-admin-ausencias"
            onClick={() => { setAusenciaDia(chaveDe(new Date())); setAusenciasAberto(true); }}
          >
            🏖️ Folgas &amp; feriados
          </button>
          {!testeAtivo && (
            <button
              className="btn-admin-ausencias btn-admin-teste"
              onClick={() => entrarModoTeste(dados, meuDispositivo)}
              title="Abrir um ambiente de teste isolado (nada é salvo no servidor)"
            >
              🧪 Ambiente de teste
            </button>
          )}
          <button
            className="btn-admin-ausencias btn-admin-equipe"
            onClick={abrirEquipe}
            title="Definir sexo, setor e cor da tag de cada usuário"
          >
            👥 Equipe
          </button>
          {Array.isArray(dados.excluidos) && dados.excluidos.length > 0 && (
            <button
              className="btn-admin-ausencias btn-admin-excluidos"
              onClick={() => setExcluidosAberto(true)}
              title="Ver e recuperar cards excluídos"
            >
              🗑️ Cards excluídos ({dados.excluidos.length})
            </button>
          )}
        </div>
      )}

      {souAdmin && excluidosAberto && (
        <div className="modal-fundo" onClick={() => setExcluidosAberto(false)}>
          <div className="modal-sino" onClick={(e) => e.stopPropagation()}>
            <h2 className="nome">🗑️ Cards excluídos</h2>
            <p className="sub">
              Toda exclusão vem parar aqui — só você vê esta lista. Recupere um
              usuário a qualquer momento; ele volta com todo o histórico e as
              conquistas.
            </p>
            {(!dados.excluidos || dados.excluidos.length === 0) ? (
              <p className="excluidos-vazio">Nenhum card excluído no momento. 🎉</p>
            ) : (
              <div className="excluidos-lista">
                {dados.excluidos
                  .slice()
                  .sort((a, b) => Number(b.em || 0) - Number(a.em || 0))
                  .map((e) => {
                    const m = e.membro || {};
                    const quando = e.em
                      ? new Date(e.em).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" }) +
                        " às " +
                        new Date(e.em).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })
                      : "";
                    return (
                      <div key={m.id} className="excluido-item">
                        <div className="excluido-info">
                          <span className="excluido-nome">{m.name}</span>
                          <span className="excluido-meta">
                            Garrafa de {fmt(m.bottleMl || 0)} · meta {fmt(m.goalMl || 0)}
                            {quando && ` · excluído em ${quando}`}
                            {e.por && ` por ${e.por}`}
                          </span>
                        </div>
                        <div className="excluido-acoes">
                          {excluirConfirmaId === m.id ? (
                            <React.Fragment>
                              <span className="excluido-confirma-txt">Apagar de vez?</span>
                              <button className="mini sim" onClick={() => { excluirDefinitivo(m.id); setExcluirConfirmaId(null); }}>
                                Sim
                              </button>
                              <button className="mini" onClick={() => setExcluirConfirmaId(null)}>
                                Não
                              </button>
                            </React.Fragment>
                          ) : (
                            <React.Fragment>
                              <button className="mini-aplicar excluido-recuperar" onClick={() => recuperarCard(m.id)}>
                                ♻️ Recuperar
                              </button>
                              <button className="excluido-apagar" onClick={() => setExcluirConfirmaId(m.id)} title="Apagar definitivamente">
                                Apagar de vez
                              </button>
                            </React.Fragment>
                          )}
                        </div>
                      </div>
                    );
                  })}
              </div>
            )}
            <button className="beber fechar-modal" onClick={() => setExcluidosAberto(false)}>
              Fechar
            </button>
          </div>
        </div>
      )}

      {souAdmin && equipeAberto && (
        <div className="modal-fundo" onClick={() => setEquipeAberto(false)}>
          <div className="modal-sino equipe-modal" onClick={(e) => e.stopPropagation()}>
            <h2 className="nome">👥 Equipe</h2>
            <p className="sub">
              Defina o sexo (usado no selo “O/A MELHOR”), o setor e a cor da tag
              de cada usuário. Só você vê e edita isto.
            </p>
            <div className="equipe-lista">
              {dados.members.map((m) => {
                const d = equipeDraft[m.id] || { sexo: "m", setor: "" };
                return (
                  <div key={m.id} className="equipe-item">
                    <span className="equipe-nome">{m.name}</span>
                    <div className="equipe-campos">
                      <label className="equipe-campo">
                        <span>Sexo</span>
                        <select value={d.sexo} onChange={(e) => mudarEquipe(m.id, "sexo", e.target.value)}>
                          <option value="m">Masculino</option>
                          <option value="f">Feminino</option>
                        </select>
                      </label>
                      <div className="equipe-campo equipe-campo-setor">
                        <span>Setor</span>
                        <SetorDropdown
                          value={d.setor}
                          setores={equipeSetores}
                          onSelecionar={(nome) => mudarEquipe(m.id, "setor", nome)}
                          onCriar={(s) => { adicionarSetor(s); mudarEquipe(m.id, "setor", s.nome); }}
                          onEditarSetor={editarSetor}
                          onRemoverSetor={removerSetor}
                        />
                      </div>
                    </div>
                    {nomeNormalizado(m.name) !== ADMIN_NOME && (
                      equipeExcluirId === m.id ? (
                        <div className="equipe-excluir-confirma">
                          <span>Excluir {m.name}? Fica recuperável no histórico.</span>
                          <button className="mini" onClick={() => setEquipeExcluirId(null)}>Não</button>
                          <button className="mini sim" onClick={() => { remover(m.id); setEquipeExcluirId(null); }}>Sim</button>
                        </div>
                      ) : (
                        <button className="equipe-excluir" onClick={() => setEquipeExcluirId(m.id)} title={`Excluir ${m.name}`}>
                          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M3 6h18" /><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" /></svg>
                          Excluir
                        </button>
                      )
                    )}
                  </div>
                );
              })}
            </div>
            <div className="equipe-acoes">
              <button className="desfazer" onClick={() => setEquipeAberto(false)}>Cancelar</button>
              <button className="beber" onClick={salvarEquipe}>Salvar</button>
            </div>
          </div>
        </div>
      )}

      {testeAtivo && dados && testeOculto && (
        <button className="teste-mostrar" onClick={() => setTesteOculto(false)} title="Mostrar o ambiente de teste">🧪 Mostrar teste</button>
      )}
      {testeAtivo && dados && !testeOculto && (
        <div className="teste-barra">
          <div className="teste-topo">
            <span className="teste-tag">🧪 AMBIENTE DE TESTE</span>
            <span className="teste-aviso">sandbox local desta aba • nada é salvo no servidor</span>
            <button className="teste-ocultar" onClick={() => setTesteOculto(true)} title="Ocultar a barra">Ocultar</button>
            <button className="teste-sair" onClick={sairModoTeste}>Sair do teste</button>
          </div>
          <div className="teste-linha">
            <label className="teste-campo">
              <span>Ver como</span>
              <select value={meuDispositivo} onChange={(e) => testeVerComo(e.target.value)}>
                {dados.members.map((m) => (
                  <option key={m.id} value={m.ownerId || ("d-teste-" + m.id)}>{m.name}</option>
                ))}
              </select>
            </label>
            <button className="teste-btn2" onClick={testeRessincronizar} title="Puxar os dados atuais do time para o sandbox">↻ Ressincronizar com produção</button>
          </div>
          <div className="teste-linha">
            <label className="teste-campo">
              <span>Poder</span>
              <select value={tPoder} onChange={(e) => setTPoder(e.target.value)}>
                {PODERES.map((p) => (<option key={p.id} value={p.id}>{p.icone} {p.nome}</option>))}
              </select>
            </label>
            <label className="teste-campo">
              <span>Alvo</span>
              <select value={tAlvo || (dados.members[0] ? dados.members[0].id : "")} onChange={(e) => setTAlvo(e.target.value)}>
                {dados.members.map((m) => (<option key={m.id} value={m.id}>{m.name}</option>))}
              </select>
            </label>
            <button className="teste-btn" onClick={() => aplicarPoderTeste(tPoder, tAlvo || (dados.members[0] && dados.members[0].id))}>Aplicar poder</button>
          </div>
          <div className="teste-linha">
            <button className="teste-btn2" onClick={() => limparEfeitosTeste(tAlvo || (dados.members[0] && dados.members[0].id))}>Limpar efeitos do alvo</button>
            <button className="teste-btn2" onClick={() => limparEfeitosTeste("__all__")}>Limpar tudo</button>
          </div>
        </div>
      )}

      <HistoricoSemanal
        members={dados.members}
        intake={dados.intake}
        extras={dados.extras || {}}
        historico={dados.historico || {}}
        onHistorico={setHistoricoDe}
        ausencias={dados.ausencias || {}}
      />

      {souAdmin && ausenciasAberto && (() => {
        const diaDate = new Date(ausenciaDia + "T12:00:00");
        const deslocar = (delta) => { const d = new Date(diaDate); d.setDate(d.getDate() + delta); setAusenciaDia(chaveDe(d)); };
        const nomeDiaSemana = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"][diaDate.getDay()];
        const dataFmt = `${String(diaDate.getDate()).padStart(2,"0")}/${String(diaDate.getMonth()+1).padStart(2,"0")}/${diaDate.getFullYear()}`;
        const fimDeSemana = diaDate.getDay() === 0 || diaDate.getDay() === 6;
        const feriadoNacional = ehFeriado(diaDate);
        const aus = dados.ausencias || {};
        const feriadoManual = (aus.feriados || []).includes(ausenciaDia);
        const folgasHoje = (aus.folgas && aus.folgas[ausenciaDia]) || [];
        return (
          <div className="modal-fundo" onClick={() => setAusenciasAberto(false)}>
            <div className="modal-sino" onClick={(e) => e.stopPropagation()}>
              <button className="modal-x" title="Fechar" aria-label="Fechar" onClick={() => setAusenciasAberto(false)}>×</button>
              <h2 className="bloco-titulo" style={{ marginTop: 0 }}>🏖️ Folgas &amp; feriados</h2>
              <p className="sub" style={{ marginTop: 2 }}>
                Marque quem está de folga ou um feriado que o calendário não pegou. Dias marcados não contam no ranking e aparecem com selo no lugar da gota.
              </p>

              <div className="aus-navdia">
                <button onClick={() => deslocar(-1)} aria-label="Dia anterior">‹</button>
                <div className="aus-dia-rotulo">{nomeDiaSemana}<span>{dataFmt}</span></div>
                <button onClick={() => deslocar(1)} aria-label="Próximo dia">›</button>
              </div>

              {fimDeSemana ? (
                <div className="aus-nota">Fim de semana já não conta no ranking — não há o que marcar aqui.</div>
              ) : feriadoNacional ? (
                <div className="aus-nota">Feriado nacional (automático) — este dia já não conta para ninguém.</div>
              ) : (
                <>
                  <div className="aus-feriado-linha">
                    <div>
                      <div className="rot">Feriado (todos)</div>
                      <div className="sub2">O dia inteiro não conta para ninguém</div>
                    </div>
                    <button
                      className={`aus-switch ${feriadoManual ? "on" : ""}`}
                      aria-pressed={feriadoManual}
                      aria-label="Marcar o dia como feriado"
                      onClick={() => alternarFeriado(ausenciaDia)}
                    />
                  </div>
                  {feriadoManual ? (
                    <div className="aus-nota">Dia marcado como feriado — todo mundo fica de folga.</div>
                  ) : (
                    <>
                      <div className="aus-titulo-sec">Quem está de folga</div>
                      <div className="aus-chips">
                        {dados.members.map((m) => {
                          const on = folgasHoje.includes(m.id);
                          return (
                            <button
                              key={m.id}
                              className={`aus-chip ${on ? "on" : ""}`}
                              aria-pressed={on}
                              onClick={() => alternarFolga(ausenciaDia, m.id)}
                            >
                              <span className="ponto" />{m.name}
                            </button>
                          );
                        })}
                      </div>
                    </>
                  )}
                </>
              )}
            </div>
          </div>
        );
      })()}

      <footer className="rodape">
        Os registros são salvos automaticamente e compartilhados entre todos os
        dispositivos. Os contadores reiniciam a cada dia — o histórico fica
        guardado.
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<AguaTracker />);
</script>
</body>
</html>
